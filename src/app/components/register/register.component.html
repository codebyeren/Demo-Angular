<body class="align">
    <div class="grid">
      <div class="header">
        <svg class="icon icon-user" viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
        </svg>
        <h2>Member Register</h2>
      </div>
  
      <form #registerForm="ngForm" (ngSubmit)="registerForm.valid && onRegister()" class="form formInput">
        <div class="form__field">
          <input
            id="register__username"
            type="text"
            name="username"
            class="form__input"
            placeholder="Enter your username"
            [(ngModel)]="user.username"
            required
            #usernameInput="ngModel"
            [class.is-invalid]="usernameInput.invalid && (usernameInput.touched || usernameInput.dirty)"
          />
          <div *ngIf="usernameInput.invalid && (usernameInput.touched || usernameInput.dirty)" class="invalid-feedback">
            Username is invalid.
          </div>
        </div>
  
        <div class="form__field">
          <input
            id="register__password"
            type="password"
            name="password"
            class="form__input"
            placeholder="Enter your password"
            [(ngModel)]="user.password"
            required
            #passwordInput="ngModel"
            [class.is-invalid]="passwordInput.invalid && (passwordInput.touched || passwordInput.dirty)"
          />
          <div *ngIf="passwordInput.invalid && (passwordInput.touched || passwordInput.dirty)" class="invalid-feedback">
            Password is invalid.
          </div>
        </div>
  
        <div class="form__field">
          <input
            id="register__email"
            type="email"
            name="email"
            class="form__input"
            placeholder="Enter your email"
            [(ngModel)]="user.email"
            required
            #emailInput="ngModel"
            [class.is-invalid]="emailInput.invalid && (emailInput.touched || emailInput.dirty)"
          />
          <div *ngIf="emailInput.invalid && (emailInput.touched || emailInput.dirty)" class="invalid-feedback">
            Email is invalid.
          </div>
        </div>
  
        <div class="form__field">
          <input type="submit" value="SIGN UP" [disabled]="registerForm.invalid" />
        </div>
      </form>
  
      <p *ngIf="errorMessage" class="text--center text-danger">{{ errorMessage }}</p>
  
      <div class="links text--center">
        <div class="link-item">
          <span class="link-text">Already a member? </span>
          <a class="highlight-link" (click)="navigateToLogin($event)">Sign In Now</a>
        </div>
      </div>
    </div>
  </body>
